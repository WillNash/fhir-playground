version: "3.9"

services:

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: hapi
      POSTGRES_PASSWORD: hapi
    volumes:
      - hapi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hapi"]
      interval: 5s
      timeout: 3s
      retries: 20

  hapi:
    image: hapiproject/hapi:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_CONFIG_LOCATION: file:///data/hapi/application.yaml
    volumes:
      - ./hapi-config:/data/hapi:ro
    depends_on:
      postgres:
        condition: service_healthy
    # HAPI is a Spring Boot app — allow 90s for initial startup
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/fhir/metadata > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

volumes:
  hapi-postgres:
    name: fhir-demo-hapi-postgres
